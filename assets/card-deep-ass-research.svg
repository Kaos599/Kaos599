<svg fill="none" viewBox="0 0 800 160" width="800" height="160" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes card-glow {
      0%, 100% { opacity: 0.05; }
      50% { opacity: 0.12; }
    }
  </style>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="160" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="3" height="160" rx="1.5" fill="#f0883e"/>
  <!-- Title -->
  <text x="24" y="32" font-size="18" font-weight="bold" font-family="'Courier New', monospace">
    <tspan fill="#58a6ff">Deep-Ass-Research </tspan><tspan fill="#ec4899">::</tspan><tspan fill="#58a6ff"> Agentic Research Framework</tspan>
  </text>
  <!-- Badge -->
  <rect x="24" y="42" width="110" height="22" rx="4" fill="#241307" stroke="#f0883e" stroke-width="1"/>
  <text x="79" y="57" text-anchor="middle" font-size="11" fill="#f0883e" font-family="'Courier New', monospace">AGENT FRAMEWORK</text>
  <!-- Description -->
  <text x="24" y="82" font-size="11" fill="#8b949e" font-family="'Courier New', monospace">Maps a topic wide, commits to depth on purpose,</text>
  <text x="24" y="98" font-size="11" fill="#8b949e" font-family="'Courier New', monospace">adversarially verifies, then writes an Obsidian vault.</text>
  <!-- Tags -->
  <rect x="24" y="112" width="68" height="22" rx="11" fill="none" stroke="#ec4899" stroke-opacity="0.4"/>
  <text x="58" y="127" text-anchor="middle" font-size="10" fill="#ec4899" font-family="'Courier New', monospace">Agentic</text>
  <rect x="100" y="112" width="62" height="22" rx="11" fill="none" stroke="#ec4899" stroke-opacity="0.4"/>
  <text x="131" y="127" text-anchor="middle" font-size="10" fill="#ec4899" font-family="'Courier New', monospace">Python</text>
  <rect x="170" y="112" width="74" height="22" rx="11" fill="none" stroke="#ec4899" stroke-opacity="0.4"/>
  <text x="207" y="127" text-anchor="middle" font-size="10" fill="#ec4899" font-family="'Courier New', monospace">Obsidian</text>
  <!-- Ambient glow -->
  <circle cx="750" cy="130" r="80" fill="url(#glow)" style="animation: card-glow 4s ease-in-out infinite"/>
</svg>
